      priorityClassName: system-node-critical
      initContainers:
      - name: configuration
        image: "ghcr.io/spegel-org/spegel@sha256:b48194957bf9b5bdcea2700536a302ade23315082b05e5a44c0822f5c301850a"
        imagePullPolicy: IfNotPresent
        securityContext:
            readOnlyRootFilesystem: true
        args:
          - configuration
          - --log-level=INFO
          - --containerd-registry-config-path=/etc/cri/conf.d/hosts
