all:
  children:
    kvm_hosts:
      hosts:
        mf-ms-a2-01.usmnblm01.rye.ninja: {}
      vars:
        ansible_user: automation-user
        # ansible_ssh_private_key_file: ~/.ssh/id_rsa

    pcd_vms:
      hosts:
        pcd-ce:
          ansible_host: "fd97:45c2:b3a1:100::dead"
      vars:
        ansible_user: ubuntu

    pcd_hypervisors:
      hosts:
        pcd-ce-hyp-01:
          ansible_host: "fd97:45c2:b3a1:100:e481:3fff:fec5:249f"
          netplan_overrides:
            network:
              bonds:
                bond0:
                  addresses:
                    - 10.45.60.1/16
                    - fd97:45c2:b3a1:100::2001/64
      vars:
        ansible_user: automation-user
        netplan:
          network:
            version: 2
            ethernets:
              enp4s0f0np0: {}
              enp4s0f1np1: {}
            bonds:
              bond0:
                dhcp4: false
                dhcp6: false
                interfaces:
                  - enp4s0f0np0
                  - enp4s0f1np1
                parameters:
                  mode: 802.3ad
                  lacp-rate: fast
                  transmit-hash-policy: layer2+3
                nameservers:
                  addresses:
                  - 10.45.0.1
                  - 1.1.1.1
                  search: []
                routes:
                - to: default
                  via: 10.45.0.1
